name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.3, MacBook Air M2"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Osmo Pocket model and firmware
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
